name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'MiniTavern.ipa'
      - 'VERSION'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Get file size
        id: filesize
        run: echo "size=$(stat -c%s MiniTavern.ipa)" >> $GITHUB_OUTPUT

      - name: Get current date
        id: date
        run: echo "date=$(date -u +"%Y-%m-%dT%H:%M:%S%z")" >> $GITHUB_OUTPUT

      - name: Create Release and Upload IPA
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MiniTavern v${{ steps.version.outputs.version }}
          files: MiniTavern.ipa
          draft: false
          prerelease: false

      - name: Update source.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DATE: ${{ steps.date.outputs.date }}
          SIZE: ${{ steps.filesize.outputs.size }}
          DOWNLOAD_URL: https://github.com/hornysillicon/MiniTavernReleases/releases/download/v${{ steps.version.outputs.version }}/MiniTavern.ipa
        run: |
          python3 << 'EOF'
          import json
          import os

          version = os.environ['VERSION']
          date = os.environ['DATE']
          size = int(os.environ['SIZE'])
          download_url = os.environ['DOWNLOAD_URL']

          with open('source.json', 'r') as f:
              data = json.load(f)

          new_entry = {
              "version": version,
              "date": date,
              "size": size,
              "downloadURL": download_url,
              "localizedDescription": f"Version {version}"
          }

          # Remove existing version if present (avoid duplicates)
          data['apps'][0]['versions'] = [v for v in data['apps'][0]['versions'] if v.get('version') != version]

          # Insert at beginning (AltStore treats first as latest)
          data['apps'][0]['versions'].insert(0, new_entry)

          with open('source.json', 'w') as f:
              json.dump(data, f, indent=4)
          EOF

      - name: Commit source.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add source.json
          git commit -m "Update source.json for v${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push
